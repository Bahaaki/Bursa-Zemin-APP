name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Analyze & Test (runs on every push/PR)
  # ─────────────────────────────────────────────
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

  # ─────────────────────────────────────────────
  # Job 2: Release APK (runs only on v* tags)
  # ─────────────────────────────────────────────
  release-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK (debug signing — portfolio use only)
        # No keystore provided. flutter build apk --release falls back to
        # signingConfig = signingConfigs.debug (see android/app/build.gradle).
        # This produces a fully functional APK for side-loading and portfolio
        # distribution but is NOT eligible for Google Play Store submission.
        run: flutter build apk --release

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Bursa Zemin ${{ github.ref_name }}
          body: |
            **Bursa Zemin** ${{ github.ref_name }}

            > ⚠️ This APK is signed with Flutter's default **debug key** (portfolio use only).
            > It is NOT a Play Store release.

            **Disclaimer:** *Ön değerlendirmedir, zemin etüdünün yerine geçmez.*
